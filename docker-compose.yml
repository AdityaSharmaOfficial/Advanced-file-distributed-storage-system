name: distributed-storage

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storage}
      POSTGRES_USER: ${POSTGRES_USER:-storage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  coordinator:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-storage}
      DB_USER: ${POSTGRES_USER:-storage}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${COORDINATOR_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  storage-node-1:
    build: ./backend
    command: ["-Dloader.main=dev.storage.os.StorageNodeApplication", "-jar", "/app/app.jar"]
    environment:
      NODE_NAME: node-1
      NODE_PUBLIC_URL: http://storage-node-1:8080
      COORDINATOR_URL: http://coordinator:8080
      DATA_DIR: /data/chunks
    volumes:
      - node-1-data:/data/chunks
    depends_on:
      - coordinator
    restart: unless-stopped

  storage-node-2:
    build: ./backend
    command: ["-Dloader.main=dev.storage.os.StorageNodeApplication", "-jar", "/app/app.jar"]
    environment:
      NODE_NAME: node-2
      NODE_PUBLIC_URL: http://storage-node-2:8080
      COORDINATOR_URL: http://coordinator:8080
      DATA_DIR: /data/chunks
    volumes:
      - node-2-data:/data/chunks
    depends_on:
      - coordinator
    restart: unless-stopped

  storage-node-3:
    build: ./backend
    command: ["-Dloader.main=dev.storage.os.StorageNodeApplication", "-jar", "/app/app.jar"]
    environment:
      NODE_NAME: node-3
      NODE_PUBLIC_URL: http://storage-node-3:8080
      COORDINATOR_URL: http://coordinator:8080
      DATA_DIR: /data/chunks
    volumes:
      - node-3-data:/data/chunks
    depends_on:
      - coordinator
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_COORDINATOR_URL: http://localhost:${COORDINATOR_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - coordinator
    restart: unless-stopped

volumes:
  postgres-data:
  node-1-data:
  node-2-data:
  node-3-data:
